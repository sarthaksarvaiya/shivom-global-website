<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 850" width="100%" height="100%">
  <defs>
    <!-- Metallic Gold Linear Gradients -->
    <linearGradient id="goldLinear" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#CA8A04" />
      <stop offset="25%" stop-color="#FACC15" />
      <stop offset="50%" stop-color="#EAB308" />
      <stop offset="75%" stop-color="#FEF08A" />
      <stop offset="100%" stop-color="#A16207" />
    </linearGradient>

    <linearGradient id="goldSheen" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#854D0E" />
      <stop offset="35%" stop-color="#FDE047" />
      <stop offset="65%" stop-color="#CA8A04" />
      <stop offset="100%" stop-color="#713F12" />
    </linearGradient>

    <!-- Deep Maritime Navy Gradients -->
    <radialGradient id="globeRadial" cx="45%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#1E3A8A" />
      <stop offset="45%" stop-color="#0F172A" />
      <stop offset="85%" stop-color="#020617" />
      <stop offset="100%" stop-color="#000000" />
    </radialGradient>

    <!-- Luminous Silver / Platinum Gradient for Brand Letters -->
    <linearGradient id="silverTextGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="50%" stop-color="#F8FAFC" />
      <stop offset="85%" stop-color="#E2E8F0" />
      <stop offset="100%" stop-color="#CBD5E1" />
    </linearGradient>

    <!-- Continental Landmass Gradient -->
    <linearGradient id="continentGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EAB308" />
      <stop offset="50%" stop-color="#CA8A04" />
      <stop offset="100%" stop-color="#A16207" />
    </linearGradient>

    <!-- Filters & Glows -->
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.35" />
    </filter>

    <filter id="goldGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="indiaBeaconGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- ========================================== -->
  <!-- 1. THE EMBLEM: GLOBE, ORBIT & CARGO SHIP   -->
  <!-- ========================================== -->
  <g transform="translate(400, 260)" filter="url(#softShadow)">

    <!-- Outer Concentric Golden Ring Layer 1 -->
    <circle cx="0" cy="0" r="195" fill="none" stroke="url(#goldSheen)" stroke-width="7" opacity="0.9" />
    <circle cx="0" cy="0" r="185" fill="none" stroke="#0F172A" stroke-width="3" />
    <circle cx="0" cy="0" r="180" fill="none" stroke="url(#goldLinear)" stroke-width="4.5" />

    <!-- The 3D Dark Oceanic Globe Sphere -->
    <circle cx="0" cy="0" r="174" fill="url(#globeRadial)" />

    <!-- Latitude / Longitude Subtle Wireframe Grid -->
    <g stroke="#38BDF8" stroke-opacity="0.18" stroke-width="1.2" fill="none">
      <ellipse cx="0" cy="0" rx="170" ry="60" />
      <ellipse cx="0" cy="0" rx="170" ry="120" />
      <ellipse cx="0" cy="0" rx="70" ry="170" />
      <ellipse cx="0" cy="0" rx="130" ry="170" />
      <line x1="-174" y1="0" x2="174" y2="0" />
      <line x1="0" y1="-174" x2="0" y2="174" />
    </g>

    <!-- ========================================== -->
    <!-- CONTINENTS (GOLDEN METALLIC LANDMASSES)   -->
    <!-- ========================================== -->
    <g fill="url(#continentGold)" opacity="0.95" stroke="#FDE047" stroke-width="0.8">
      <!-- Africa & Middle East -->
      <path d="M-130,-40 C-115,-70 -85,-75 -50,-65 C-40,-50 -35,-20 -40,10 C-45,30 -60,60 -75,85 C-90,105 -105,120 -115,80 C-125,50 -130,20 -135,-10 Z" />
      <path d="M-45,-70 C-30,-80 -10,-75 0,-60 C-5,-45 -20,-40 -35,-45 Z" />

      <!-- Europe & Central Asia -->
      <path d="M-110,-110 C-80,-130 -40,-125 -10,-115 C10,-105 40,-95 70,-110 C100,-120 120,-90 90,-70 C60,-50 30,-60 10,-80 C-20,-75 -60,-80 -90,-90 Z" />

      <!-- Asia & East Asia -->
      <path d="M40,-95 C80,-100 130,-80 145,-50 C150,-20 130,10 105,25 C80,30 65,0 45,-20 C35,-50 30,-70 40,-95 Z" />

      <!-- Southeast Asia & Maritime Archipelagos -->
      <circle cx="85" cy="55" r="7" />
      <circle cx="105" cy="70" r="9" />
      <circle cx="120" cy="85" r="6" />
      <circle cx="65" cy="80" r="5" />

      <!-- Madagascar Island -->
      <ellipse cx="-40" cy="100" rx="6" ry="14" transform="rotate(-20 -40 100)" />
    </g>

    <!-- ========================================== -->
    <!-- INDIA — RADIANT GOLDEN HUB (THE HEART)    -->
    <!-- ========================================== -->
    <g filter="url(#indiaBeaconGlow)">
      <!-- Detailed Indian Subcontinent Polygon -->
      <path d="M15,-55 L35,-50 L42,-35 L30,-10 L20,15 L10,35 L0,20 L-5,0 L5,-35 Z" 
            fill="#FEF08A" stroke="#FFFFFF" stroke-width="2" />
      
      <!-- Central Hub Beacon -->
      <circle cx="15" cy="-10" r="6" fill="#FFFFFF" />
      <circle cx="15" cy="-10" r="11" fill="none" stroke="#FDE047" stroke-width="2" opacity="0.9" />
    </g>

    <!-- Trade Route Arc Lines from India -->
    <g fill="none" stroke="#FEF08A" stroke-width="2" stroke-dasharray="3,3" opacity="0.95">
      <path d="M15,-10 Q-10,-35 -30,-50" />
      <path d="M15,-10 Q-20,-70 -65,-95" />
      <path d="M15,-10 Q-30,40 -70,75" />
      <path d="M15,-10 Q60,10 105,40" />
    </g>

    <!-- Trade Destination Nodes -->
    <g fill="#FFFFFF" stroke="#CA8A04" stroke-width="2">
      <circle cx="-30" cy="-50" r="5" />
      <circle cx="-65" cy="-95" r="4.5" />
      <circle cx="-70" cy="75" r="4.5" />
      <circle cx="105" cy="40" r="4.5" />
    </g>

    <!-- Globe Sphere Shading Overlay -->
    <circle cx="0" cy="0" r="174" fill="url(#globeRadial)" opacity="0.25" style="mix-blend-mode: overlay;" />

    <!-- Outer Orbital Golden Swoosh Band -->
    <path d="M-225,45 C-235,110 -150,175 -20,175 C80,175 160,135 220,80 L235,90 L275,55 L215,55 L225,70 C165,125 90,160 -15,160 C-135,160 -215,105 -205,50 Z" 
          fill="url(#goldLinear)" filter="url(#goldGlow)" />

    <!-- Orbital Dynamic Swoosh Ring -->
    <path d="M-245,-15 C-255,50 -200,120 -100,165 L-95,150 C-180,110 -235,45 -225,-10 Z" 
          fill="url(#goldSheen)" opacity="0.8" />

    <!-- Container Cargo Ship on Orbital Swoosh -->
    <g transform="translate(170, 20) rotate(-14)">
      <!-- Ship Hull (Deep Navy Maritime Blue) -->
      <path d="M0,35 L95,35 L125,10 L115,8 L75,8 L15,18 Z" fill="#0F172A" stroke="#334155" stroke-width="1.5" />
      <path d="M15,18 L115,8 L120,12 L0,35 Z" fill="#1E293B" />
      <!-- Bulwark / Red Waterline Accent -->
      <path d="M0,33 L95,33 L118,12 L115,10 L92,30 L0,30 Z" fill="#DC2626" />
      <!-- Cargo Containers Stack -->
      <rect x="25" y="0" width="16" height="15" fill="#C2410C" stroke="#7C2D12" stroke-width="0.8" />
      <rect x="42" y="-1" width="16" height="15" fill="#1D4ED8" stroke="#1E3A8A" stroke-width="0.8" />
      <rect x="59" y="-2" width="16" height="15" fill="#0D9488" stroke="#115E59" stroke-width="0.8" />
      <rect x="76" y="-3" width="16" height="15" fill="#B45309" stroke="#78350F" stroke-width="0.8" />
      <rect x="30" y="-14" width="15" height="14" fill="#1E293B" stroke="#0F172A" stroke-width="0.8" />
      <rect x="46" y="-15" width="15" height="14" fill="#DC2626" stroke="#991B1B" stroke-width="0.8" />
      <rect x="62" y="-16" width="15" height="14" fill="#D97706" stroke="#92400E" stroke-width="0.8" />
      <!-- Bridge Superstructure & Radar Mast -->
      <rect x="94" y="-18" width="18" height="26" fill="#F8FAFC" stroke="#94A3B8" stroke-width="0.8" />
      <rect x="97" y="-14" width="12" height="4" fill="#0284C7" />
      <line x1="103" y1="-18" x2="103" y2="-28" stroke="#0F172A" stroke-width="2" />
      <line x1="99" y1="-24" x2="107" y2="-24" stroke="#0F172A" stroke-width="1.5" />
    </g>

  </g>

  <!-- ========================================== -->
  <!-- 2. BRAND TYPOGRAPHY: "SHIVOM"              -->
  <!-- ========================================== -->
  <g transform="translate(400, 600)" text-anchor="middle">
    
    <!-- Wordmark Group -->
    <g id="shivom-text" font-family="'Cinzel', 'Times New Roman', 'Playfair Display', 'Georgia', serif" font-weight="900">
      
      <!-- S -->
      <text x="-240" y="0" font-size="108" fill="url(#silverTextGrad)" stroke="url(#goldSheen)" stroke-width="1.8" letter-spacing="2">S</text>
      
      <!-- H -->
      <text x="-145" y="0" font-size="108" fill="url(#silverTextGrad)" stroke="url(#goldSheen)" stroke-width="1.8" letter-spacing="2">H</text>
      
      <!-- I -->
      <text x="-70" y="0" font-size="108" fill="url(#silverTextGrad)" stroke="url(#goldSheen)" stroke-width="1.8" letter-spacing="2">I</text>
      
      <!-- V -->
      <text x="-5" y="0" font-size="108" fill="url(#silverTextGrad)" stroke="url(#goldSheen)" stroke-width="1.8" letter-spacing="2">V</text>

      <!-- ========================================== -->
      <!-- THE SIGNATURE "O" EMBLEM (YIN-YANG SWIRL)  -->
      <!-- ========================================== -->
      <g transform="translate(95, -34)">
        <!-- Outer Gold Ring -->
        <circle cx="0" cy="0" r="44" fill="none" stroke="url(#goldSheen)" stroke-width="4.5" />
        
        <!-- Inner Silver & Gold Curved Swirl Petals (Tea Leaf / Yin-Yang Motif) -->
        <path d="M0,-42 C24,-42 42,-24 42,0 C42,24 24,42 0,42 C12,24 10,-8 -12,-20 C-26,-28 -28,-38 0,-42 Z" 
              fill="url(#silverTextGrad)" />
        
        <path d="M0,42 C-24,42 -42,24 -42,0 C-42,-24 -24,-42 0,-42 C-12,-24 -10,8 12,20 C26,28 28,38 0,42 Z" 
              fill="url(#goldLinear)" />

        <path d="M-18,-8 C-5,-2 15,-15 28,-18 C20,-4 8,8 -10,12 Z" fill="#FEF08A" opacity="0.9" />
      </g>
      
      <!-- M -->
      <text x="215" y="0" font-size="108" fill="url(#silverTextGrad)" stroke="url(#goldSheen)" stroke-width="1.8" letter-spacing="2">M</text>
    </g>

    <!-- ========================================== -->
    <!-- 3. SUBTITLE: "— GLOBAL —"                  -->
    <!-- ========================================== -->
    <g transform="translate(0, 68)">
      <!-- Left Golden Divider Rule -->
      <line x1="-330" y1="-14" x2="-160" y2="-14" stroke="url(#goldSheen)" stroke-width="3" />
      <polygon points="-160,-17 -152,-14 -160,-11" fill="url(#goldLinear)" />

      <!-- "GLOBAL" Text -->
      <text x="0" y="0" font-family="'Trajan Pro', 'Cinzel', 'Times New Roman', serif" 
            font-size="52" font-weight="700" fill="url(#goldSheen)" letter-spacing="14">GLOBAL</text>

      <!-- Right Golden Divider Rule -->
      <polygon points="160,-17 152,-14 160,-11" fill="url(#goldLinear)" />
      <line x1="160" y1="-14" x2="330" y2="-14" stroke="url(#goldSheen)" stroke-width="3" />
    </g>

    <!-- ========================================== -->
    <!-- 4. OFFICIAL TAGLINE                        -->
    <!-- ========================================== -->
    <g transform="translate(0, 118)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="19" font-weight="800" letter-spacing="4">
      <text x="0" y="0">
        <tspan fill="#FACC15">INDIAN</tspan>
        <tspan fill="#94A3B8">  •  </tspan>
        <tspan fill="#FFFFFF">IMPORT</tspan>
        <tspan fill="#94A3B8">  •  </tspan>
        <tspan fill="#FFFFFF">EXPORT</tspan>
        <tspan fill="#94A3B8">  •  </tspan>
        <tspan fill="#FFFFFF">GLOBAL OPPORTUNITIES</tspan>
      </text>
    </g>

  </g>
</svg>
